name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fantasy_gm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # PostgreSQL integration tests are mandatory in CI: a missing server fails the build.
      FANTASY_GM_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fantasy_gm_test
      FANTASY_GM_REQUIRE_POSTGRES: "1"
      FANTASY_GM_CODE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # Install exactly the locked dependency set (reproducibility envelope, ADR 0015).
      - run: uv sync --frozen --all-extras
      - run: uv run --frozen ruff check src tests alembic
      - run: uv run --frozen ruff format --check src tests alembic
      - run: uv run --frozen mypy
      - name: Unit + acceptance + SQLite + PostgreSQL integration tests
        run: uv run --frozen pytest -ra
      - name: PostgreSQL-only subset (explicit, must not be skipped)
        run: uv run --frozen pytest -m postgres -ra
